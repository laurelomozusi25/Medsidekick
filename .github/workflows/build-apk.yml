name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # This allows you to click a button to run it manually

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Prepare Web Directory
        run: |
          mkdir www
          rsync -av --exclude='www' --exclude='.git' --exclude='.github' ./ www/

      - name: Initialize Project & Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/local-notifications
          npm install @capacitor/android
          npx cap init MedSidekick com.medsidekick.app --web-dir www
          npx cap add android

      - name: Build Android APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medsidekick-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
